name: SampleDrumMobile
options:
  bundleIdPrefix: com.markusf502
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '4'
targets:
  SampleDrumMobile:
    type: application
    platform: iOS
    sources:
      - App
      - Policy/Sources/PanelPolicy
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SampleDrum
        UILaunchScreen: {}
        NSCameraUsageDescription: Leia o QR mostrado no PC para conectar ao painel SampleDrum.
        NSLocalNetworkUsageDescription: Conecte ao PC na mesma rede para controlar samples e presets da bateria.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markusf502.sampledrum
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SampleDrumMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SampleDrumMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SampleDrumMobile:
    build:
      targets:
        SampleDrumMobile: all
    test:
      targets: [SampleDrumMobileUITests]
