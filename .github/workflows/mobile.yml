name: Mobile Android and iOS
on:
  push:
    branches: [main, 'mobile/**']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build, test and lint Android
        working-directory: mobile/android
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: mobile/android
          script: |
            gradle connectedDebugAndroidTest --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.markusf502.sampledrum/.MainActivity
            sleep 2
            adb exec-out screencap -p > app/build/reports/launcher.png
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: mobile/android/app/build/reports/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test address and origin rules
        run: swift test --package-path mobile/ios/Policy
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd mobile/ios
          xcodegen generate
      - name: Build iOS simulator app
        working-directory: mobile/ios
        run: xcodebuild -project SampleDrumMobile.xcodeproj -scheme SampleDrumMobile -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone app without signing
        working-directory: mobile/ios
        run: xcodebuild -project SampleDrumMobile.xcodeproj -scheme SampleDrumMobile -configuration Release -sdk iphoneos -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Test launcher on iPhone simulator
        working-directory: mobile/ios
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for values in d["devices"].values() for v in values if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcodebuild -project SampleDrumMobile.xcodeproj -scheme SampleDrumMobile -destination "id=$SIMULATOR" -parallel-testing-enabled NO -derivedDataPath build -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO test
          xcrun simctl install "$SIMULATOR" build/Build/Products/Debug-iphonesimulator/SampleDrumMobile.app
          xcrun simctl launch "$SIMULATOR" com.markusf502.sampledrum
          sleep 2
          xcrun simctl io "$SIMULATOR" screenshot build/launcher.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            mobile/ios/build/UITests.xcresult
            mobile/ios/build/launcher.png
      - name: Package simulator build
        working-directory: mobile/ios
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/SampleDrumMobile.app SampleDrumMobile-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: mobile/ios/SampleDrumMobile-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-unsigned
          path: mobile/ios/build-device/Build/Products/Release-iphoneos/SampleDrumMobile.app/
