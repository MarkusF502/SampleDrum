name: Mobile Android and iOS
on:
  push:
    branches: [main, 'mobile/**']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build, test and lint Android
        working-directory: mobile/android
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: mobile/android/app/build/reports/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test address and origin rules
        run: swift test --package-path mobile/ios/Policy
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd mobile/ios
          xcodegen generate
      - name: Build iOS simulator app
        working-directory: mobile/ios
        run: xcodebuild -project SampleDrumMobile.xcodeproj -scheme SampleDrumMobile -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone app without signing
        working-directory: mobile/ios
        run: xcodebuild -project SampleDrumMobile.xcodeproj -scheme SampleDrumMobile -configuration Release -sdk iphoneos -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator build
        working-directory: mobile/ios
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/SampleDrumMobile.app SampleDrumMobile-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: mobile/ios/SampleDrumMobile-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-unsigned
          path: mobile/ios/build-device/Build/Products/Release-iphoneos/SampleDrumMobile.app/
